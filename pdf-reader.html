<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc Read-Aloud</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='4' width='36' height='48' rx='5' fill='%232f6fed'/%3E%3Crect x='13' y='14' width='22' height='4' rx='2' fill='%23fff'/%3E%3Crect x='13' y='23' width='22' height='4' rx='2' fill='%23fff'/%3E%3Crect x='13' y='32' width='14' height='4' rx='2' fill='%23fff'/%3E%3Ccircle cx='46' cy='46' r='16' fill='%23ffc800'/%3E%3Cpath d='M37 42h5l6-5v18l-6-5h-5z' fill='%231d1d1f'/%3E%3Cpath d='M52 40a8 8 0 0 1 0 12' stroke='%231d1d1f' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1f;--muted:#6b6b70;--accent:#2f6fed;--hl:rgba(255,200,0,.42);--line:#e3e2de}
  @media (prefers-color-scheme:dark){:root{--bg:#18181a;--panel:#232326;--ink:#ececee;--muted:#9a9aa0;--accent:#6b9bff;--hl:rgba(255,200,0,.38);--line:#333337}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1.app{font-size:16px;margin:0 12px 0 0}
  button,select,label.file{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  label.file input{display:none}
  #status{color:var(--muted);font-size:13px;margin-left:auto}
  #bar{height:3px;background:var(--accent);width:0;transition:width .2s}
  #drop{margin:40px auto;max-width:560px;border:2px dashed var(--line);border-radius:14px;padding:48px 20px;text-align:center;color:var(--muted)}
  #drop.over{border-color:var(--accent);color:var(--accent)}
  #pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px}
  .page{position:relative;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);max-width:100%;cursor:pointer}
  .page canvas{display:block;width:100%;height:auto}
  .hl{position:absolute;background:var(--hl);border-radius:2px;pointer-events:none;mix-blend-mode:multiply}
  .doc{background:var(--panel);color:var(--ink);max-width:820px;width:100%;padding:40px 48px;box-shadow:0 1px 6px rgba(0,0,0,.12);border-radius:6px;font:17px/1.65 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
  .doc img{max-width:100%;height:auto}
  .doc table{border-collapse:collapse;margin:1em 0}.doc td,.doc th{border:1px solid var(--line);padding:4px 8px}
  .doc pre{white-space:pre-wrap}
  .doc .slide{border-top:1px solid var(--line);padding-top:12px;margin-top:20px}
  .textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;z-index:2}
  .textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
  .textLayer ::selection{background:rgba(47,111,237,.3)}
  .s{cursor:pointer;border-radius:3px}
  .s:hover{background:rgba(127,127,127,.12)}
  .s.on{background:var(--hl)}
  #now{padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;min-height:20px;color:var(--muted)}
  @media (max-width:600px){.doc{padding:20px 16px}}
</style>
</head>
<body>
<header>
  <h1 class="app">Read-Aloud</h1>
  <label class="file">Open file<input id="file" type="file"
    accept=".pdf,.docx,.odt,.rtf,.txt,.md,.markdown,.html,.htm,.epub,.pptx,.xlsx,.csv,.png,.jpg,.jpeg,.webp,.bmp,.gif"></label>
  <button id="play" class="primary" disabled>▶ Play</button>
  <button id="stop" disabled>■ Stop</button>
  <button id="readsel" disabled title="Select text in the document, then click to read just that part">🔈 Read selection</button>
  <select id="voice" title="Voice">
    <option value="af_heart">Heart (US female)</option>
    <option value="af_bella">Bella (US female)</option>
    <option value="am_michael">Michael (US male)</option>
    <option value="am_fenrir">Fenrir (US male)</option>
    <option value="bf_emma">Emma (UK female)</option>
    <option value="bm_george">George (UK male)</option>
  </select>
  <select id="speed" title="Speed">
    <option value="0.85">0.85×</option><option value="1" selected>1×</option>
    <option value="1.15">1.15×</option><option value="1.3">1.3×</option>
  </select>
  <button id="export" disabled title="Generate the whole document and save as MP3">⬇ Save audio</button>
  <span id="status">Loading voice model…</span>
</header>
<div id="bar"></div>
<div id="now"></div>
<div id="drop">Drop a file here or click <b>Open file</b>.<br>
  <small>PDF · Word (DOCX) · OpenDocument (ODT) · RTF · TXT · Markdown · HTML · EPUB · PowerPoint (PPTX) · Excel (XLSX) · CSV · Images (OCR)</small><br>
  <small>Everything runs on your computer — files are never uploaded.</small></div>
<div id="pages"></div>

<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

const $ = id => document.getElementById(id);
const status = t => $("status").textContent = t;
let tts = null, sentences = [], cur = -1, playing = false, runId = 0;
const cache = new Map();
let ctx = null, src = null;

// ---------- Lazy loaders for format libraries (only fetched when needed) ----------
const loaded = {};
function script(url, globalName) {
  return loaded[url] ||= new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = url;
    s.onload = () => res(window[globalName]); s.onerror = () => rej(new Error("Failed to load " + url));
    document.head.appendChild(s);
  });
}
const lib = {
  mammoth: () => script("https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js", "mammoth"),
  jszip:   () => script("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js", "JSZip"),
  xlsx:    () => script("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js", "XLSX"),
  lame:    () => script("https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js", "lamejs"),
  tess:    () => script("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js", "Tesseract"),
  marked:  () => loaded.marked ||= import("https://cdn.jsdelivr.net/npm/marked@12.0.2/+esm").then(m => m.marked),
};

// ---------- Load local TTS model ----------
(async () => {
  try {
    const device = navigator.gpu ? "webgpu" : "wasm";
    tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", {
      dtype: device === "webgpu" ? "fp32" : "q8", device,
      progress_callback: p => { if (p.status === "progress" && p.total) status(`Downloading voice model… ${Math.round(p.loaded/p.total*100)}%`); }
    });
    status(`Voice ready (${device})` + (sentences.length ? ` · ${sentences.length} sentences` : ""));
    refresh();
  } catch (e) { console.error(e); status("Voice model failed to load: " + e.message); }
})();

// ---------- File opening ----------
$("file").onchange = e => e.target.files[0] && openFile(e.target.files[0]);
const drop = $("drop");
["dragover","dragenter"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) openFile(f); });

async function openFile(file) {
  stop(); cache.clear(); sentences = []; cur = -1;
  $("pages").innerHTML = ""; drop.style.display = "none";
  const ext = file.name.split(".").pop().toLowerCase();
  status(`Reading ${file.name}…`);
  try {
    if (ext === "pdf") return await openPdf(file);
    let html;
    switch (ext) {
      case "docx": html = (await (await lib.mammoth()).convertToHtml({ arrayBuffer: await file.arrayBuffer() })).value; break;
      case "odt":  html = await odtToHtml(file); break;
      case "epub": html = await epubToHtml(file); break;
      case "pptx": html = await pptxToHtml(file); break;
      case "xlsx": case "csv": html = await sheetToHtml(file, ext); break;
      case "md": case "markdown": html = (await lib.marked()).parse(await file.text()); break;
      case "html": case "htm": html = await file.text(); break;
      case "rtf":  html = textToHtml(rtfToText(await file.text())); break;
      case "png": case "jpg": case "jpeg": case "webp": case "bmp": case "gif": html = await ocrToHtml(file); break;
      default:     html = textToHtml(await file.text());
    }
    showDoc(html);
  } catch (e) { console.error(e); status("Could not read this file: " + e.message); drop.style.display = ""; }
}

// ---------- Converters (all run in the browser) ----------
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function textToHtml(t) {
  return t.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => `<p>${esc(p).replace(/\n/g, " ")}</p>`).join("");
}
function rtfToText(rtf) {
  return rtf.replace(/\\par[d]?/g, "\n").replace(/\{\\\*[^}]*\}/g, "").replace(/\\'([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/\\u(-?\d+)\??/g, (_, n) => String.fromCharCode(n < 0 ? +n + 65536 : +n))
    .replace(/\{\\(fonttbl|colortbl|stylesheet|info)[\s\S]*?\}\}?/g, "").replace(/\\[a-z]+-?\d* ?/gi, "").replace(/[{}]/g, "");
}
const xml = s => new DOMParser().parseFromString(s, "application/xml");
async function odtToHtml(file) {
  const zip = await (await lib.jszip()).loadAsync(file);
  const doc = xml(await zip.file("content.xml").async("string"));
  return [...doc.getElementsByTagName("*")].filter(n => n.localName === "h" || n.localName === "p")
    .map(n => { const t = esc(n.textContent.trim()); return t ? (n.localName === "h" ? `<h2>${t}</h2>` : `<p>${t}</p>`) : ""; }).join("");
}
async function pptxToHtml(file) {
  const zip = await (await lib.jszip()).loadAsync(file);
  const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f))
    .sort((a, b) => a.match(/\d+/g).pop() - b.match(/\d+/g).pop());
  let out = "";
  for (const [i, f] of slides.entries()) {
    const d = xml(await zip.file(f).async("string"));
    const paras = [...d.getElementsByTagName("a:p")].map(p => [...p.getElementsByTagName("a:t")].map(t => t.textContent).join("").trim()).filter(Boolean);
    if (paras.length) out += `<div class="slide"><h3>Slide ${i + 1}</h3>${paras.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
  }
  return out;
}
async function epubToHtml(file) {
  const zip = await (await lib.jszip()).loadAsync(file);
  const container = xml(await zip.file("META-INF/container.xml").async("string"));
  const opfPath = container.getElementsByTagName("rootfile")[0].getAttribute("full-path");
  const base = opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
  const opf = xml(await zip.file(opfPath).async("string"));
  const items = Object.fromEntries([...opf.getElementsByTagName("item")].map(i => [i.getAttribute("id"), i.getAttribute("href")]));
  let out = "";
  for (const ref of opf.getElementsByTagName("itemref")) {
    const href = items[ref.getAttribute("idref")]; if (!href) continue;
    const f = zip.file(decodeURIComponent(base + href)); if (!f) continue;
    const d = new DOMParser().parseFromString(await f.async("string"), "text/html");
    d.querySelectorAll("img,image,svg").forEach(n => n.remove());
    out += `<section>${d.body ? d.body.innerHTML : ""}</section>`;
  }
  return out;
}
async function sheetToHtml(file, ext) {
  const X = await lib.xlsx();
  const wb = ext === "csv" ? X.read(await file.text(), { type: "string" }) : X.read(await file.arrayBuffer());
  return wb.SheetNames.map(n => {
    const rows = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false });
    return `<h2>${esc(n)}</h2>` + rows.map(r => `<p>${esc(r.filter(c => c !== "" && c != null).join(", "))}.</p>`).join("");
  }).join("");
}
async function ocrToHtml(file) {
  const T = await lib.tess();
  const { data } = await T.recognize(file, "eng", { logger: m => m.progress && status(`OCR: ${m.status} ${Math.round(m.progress * 100)}%`) });
  return `<img src="${URL.createObjectURL(file)}">` + textToHtml(data.text);
}

// ---------- Show a non-PDF document with clickable sentence spans ----------
const BLOCKS = "p,h1,h2,h3,h4,h5,h6,li,td,th,blockquote,pre,dd,dt,figcaption,caption";
function showDoc(html) {
  const d = new DOMParser().parseFromString(html, "text/html");
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input,button").forEach(n => n.remove());
  d.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
  const doc = document.createElement("div"); doc.className = "doc";
  doc.append(...d.body.childNodes);
  // Wrap loose text in a container with no block children
  let leaves = [...doc.querySelectorAll(BLOCKS)].filter(b => !b.querySelector(BLOCKS));
  if (!leaves.length && doc.textContent.trim()) { doc.innerHTML = textToHtml(doc.textContent); leaves = [...doc.querySelectorAll("p")]; }
  for (const b of leaves) {
    const text = b.textContent.replace(/\s+/g, " ").trim();
    if (!/[A-Za-z0-9]/.test(text)) continue;
    const imgs = [...b.querySelectorAll("img")];
    b.textContent = "";
    imgs.forEach(i => b.appendChild(i));
    for (const s of splitSentences(text)) {
      for (const chunk of splitLong(s)) {
        const span = document.createElement("span"); span.className = "s"; span.dataset.i = sentences.length;
        span.textContent = chunk + " "; b.appendChild(span);
        sentences.push({ text: chunk, el: span });
      }
    }
  }
  doc.onclick = e => { if (!getSelection().isCollapsed) return; const s = e.target.closest(".s"); if (s) play(+s.dataset.i); };
  $("pages").appendChild(doc);
  status(`${sentences.length} sentences` + (tts ? "" : " · waiting for voice model…"));
  refresh();
}
function splitSentences(t) {
  return (t.match(/[^.!?]+(?:[.!?]+["'”’)\]]*|$)\s*/g) || []).map(s => s.trim()).filter(s => /[A-Za-z0-9]/.test(s));
}

// ---------- PDF ----------
async function openPdf(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const width = Math.min(900, window.innerWidth - 32);
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: width / base.width });
    const ratio = window.devicePixelRatio || 1;
    const wrap = document.createElement("div"); wrap.className = "page";
    wrap.style.width = vp.width + "px";
    const canvas = document.createElement("canvas");
    canvas.width = vp.width * ratio; canvas.height = vp.height * ratio;
    wrap.appendChild(canvas); $("pages").appendChild(wrap);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp, transform: ratio !== 1 ? [ratio,0,0,ratio,0,0] : null }).promise;
    const tc = await page.getTextContent();
    buildPdfSentences(tc.items, vp, wrap);
    const tl = document.createElement("div"); tl.className = "textLayer";
    wrap.style.setProperty("--scale-factor", vp.scale); wrap.appendChild(tl);
    try { await new pdfjsLib.TextLayer({ textContentSource: tc, container: tl, viewport: vp }).render(); } catch (e) { console.warn(e); }
    wrap.onclick = ev => clickPage(wrap, ev);
    status(`Reading PDF… page ${p}/${pdf.numPages}`);
  }
  status(`${pdf.numPages} pages · ${sentences.length} sentences` + (sentences.length ? "" : " (no text found — scanned PDF? Try an image of the page for OCR)") + (tts ? "" : " · waiting for voice model…"));
  refresh();
}
function buildPdfSentences(items, vp, wrap) {
  let text = "", spans = [];
  for (const it of items) {
    if (!it.str) { if (it.hasEOL) text += " "; continue; }
    const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
    const h = Math.hypot(tx[2], tx[3]);
    spans.push({ start: text.length, end: text.length + it.str.length, len: it.str.length, rect: { x: tx[4], y: tx[5] - h, w: it.width * vp.scale, h: h * 1.15 } });
    text += it.str + (it.hasEOL ? " " : "");
  }
  const re = /[^.!?]+(?:[.!?]+["')\]]*|$)\s*/g; let m;
  while ((m = re.exec(text))) {
    if (!m[0]) break;
    const s0 = m.index, s1 = m.index + m[0].length;
    const clean = m[0].replace(/-\s+(?=[a-z])/g, "").replace(/\s+/g, " ").trim();
    if (!/[A-Za-z0-9]/.test(clean)) continue;
    const rects = [];
    for (const sp of spans) {
      if (sp.end <= s0 || sp.start >= s1) continue;
      const a = Math.max(s0, sp.start) - sp.start, b = Math.min(s1, sp.end) - sp.start;
      rects.push({ x: sp.rect.x + sp.rect.w * a / sp.len, y: sp.rect.y, w: sp.rect.w * (b - a) / sp.len, h: sp.rect.h });
    }
    for (const chunk of splitLong(clean)) sentences.push({ text: chunk, rects, wrap });
  }
}
function splitLong(s, max = 350) {
  if (s.length <= max) return [s];
  const out = []; let c = "";
  for (const part of s.split(/(?<=[,;:])\s+/)) {
    if ((c + " " + part).length > max && c) { out.push(c); c = part; } else c = c ? c + " " + part : part;
  }
  if (c) out.push(c);
  return out.flatMap(x => x.length > max * 1.5 ? x.match(new RegExp(`.{1,${max}}(\\s|$)`, "g")) : [x]);
}
function clickPage(wrap, ev) {
  if (!getSelection().isCollapsed) return;
  const b = wrap.getBoundingClientRect(), x = ev.clientX - b.left, y = ev.clientY - b.top;
  const i = sentences.findIndex(s => s.wrap === wrap && s.rects.some(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h));
  if (i >= 0) play(i);
}

// ---------- Highlighting ----------
function highlight(i) {
  document.querySelectorAll(".hl").forEach(n => n.remove());
  document.querySelectorAll(".s.on").forEach(n => n.classList.remove("on"));
  const s = sentences[i]; if (!s) { $("now").textContent = ""; return; }
  if (s.el) {
    s.el.classList.add("on"); s.el.scrollIntoView({ block: "center", behavior: "smooth" });
  } else {
    for (const r of s.rects) {
      const d = document.createElement("div"); d.className = "hl";
      Object.assign(d.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
      s.wrap.appendChild(d);
    }
    const first = s.wrap.querySelector(".hl");
    if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  $("now").textContent = s.text;
  $("bar").style.width = ((i + 1) / sentences.length * 100) + "%";
}

// ---------- Speech ----------
const key = i => `${i}|${$("voice").value}|${$("speed").value}`;
function synth(i) {
  const k = key(i);
  if (!cache.has(k)) cache.set(k, tts.generate(sentences[i].text, { voice: $("voice").value, speed: +$("speed").value })
    .then(a => ({ audio: a.audio, sr: a.sampling_rate })));
  return cache.get(k);
}
// Which sentences does the current text selection cover?
function selectedSentences() {
  const sel = getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0), rects = [...r.getClientRects()], idx = [];
  sentences.forEach((s, i) => {
    if (s.el) { if (r.intersectsNode(s.el)) idx.push(i); return; }
    const b = s.wrap.getBoundingClientRect();
    if (s.rects.some(q => rects.some(c => c.left < b.left + q.x + q.w && c.right > b.left + q.x && c.top < b.top + q.y + q.h && c.bottom > b.top + q.y))) idx.push(i);
  });
  return idx.length ? { from: idx[0], to: idx[idx.length - 1] } : null;
}
let stopAt = Infinity;
async function play(from, to = Infinity) {
  if (!tts || !sentences.length) return;
  stopAudio(); const id = ++runId; playing = true; stopAt = to; refresh();
  ctx ||= new AudioContext(); await ctx.resume();
  for (let i = from; i < sentences.length && i <= stopAt && id === runId; i++) {
    cur = i; highlight(i);
    status(`Speaking ${i + 1}/${sentences.length}`);
    const clip = await synth(i);
    for (let j = 1; j <= 2 && i + j < sentences.length; j++) synth(i + j);
    if (id !== runId) return;
    await new Promise(res => {
      const buf = ctx.createBuffer(1, clip.audio.length, clip.sr);
      buf.copyToChannel(clip.audio, 0);
      src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
      src.onended = res; src.start();
    });
  }
  if (id === runId) { playing = false; cur = -1; status("Finished"); refresh(); }
}
function stopAudio() { if (src) { src.onended = null; try { src.stop(); } catch {} src = null; } }
function pause() { runId++; stopAudio(); playing = false; status("Paused"); refresh(); }
function stop() { runId++; stopAudio(); playing = false; cur = -1; highlight(-1); $("bar").style.width = 0; refresh(); }

$("play").onclick = () => playing ? pause() : play(cur >= 0 ? cur : 0);
$("stop").onclick = stop;
$("voice").onchange = $("speed").onchange = () => { if (playing) play(cur, stopAt); };
$("readsel").onmousedown = e => e.preventDefault();   // keep the selection when clicking
$("readsel").onclick = () => { const r = selectedSentences(); if (r) { getSelection().removeAllRanges(); play(r.from, r.to); } };
document.addEventListener("selectionchange", () => { $("readsel").disabled = !(tts && selectedSentences()); });
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); $("play").click(); } });

$("export").onclick = async () => {
  const parts = []; let sr = 24000;
  $("export").disabled = true;
  for (let i = 0; i < sentences.length; i++) {
    status(`Generating audio ${i + 1}/${sentences.length}…`);
    const c = await synth(i); sr = c.sr; parts.push(c.audio, new Float32Array(Math.round(sr * 0.25)));
  }
  const total = parts.reduce((n, p) => n + p.length, 0), pcm = new Int16Array(total);
  let o = 0; for (const p of parts) for (const v of p) pcm[o++] = Math.max(-1, Math.min(1, v)) * 0x7fff;
  // Encode to MP3 (128 kbps mono) in the browser
  status("Encoding MP3…");
  const enc = new (await lib.lame()).Mp3Encoder(1, sr, 128), mp3 = [];
  for (let k = 0; k < pcm.length; k += 1152 * 20) {
    const b = enc.encodeBuffer(pcm.subarray(k, k + 1152 * 20)); if (b.length) mp3.push(new Uint8Array(b));
    if (k % (1152 * 2000) === 0) { status(`Encoding MP3… ${Math.round(k / pcm.length * 100)}%`); await new Promise(r => setTimeout(r)); }
  }
  const end = enc.flush(); if (end.length) mp3.push(new Uint8Array(end));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(mp3, { type: "audio/mpeg" })); a.download = "read-aloud.mp3"; a.click();
  status("Audio saved"); refresh();
};

function refresh() {
  const ok = !!tts && sentences.length > 0;
  $("play").disabled = !ok; $("stop").disabled = !ok; $("export").disabled = !ok;
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play";
}
</script>
</body>
</html>
